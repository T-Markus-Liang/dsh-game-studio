name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout DSH source for peer dependencies
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: .dsh-source
          fetch-depth: 1

      - name: Install DSH peer dependencies
        run: cd .dsh-source && pnpm install --no-frozen-lockfile

      - name: Link DSH packages for plugin tests
        run: |
          mkdir -p node_modules/@deepseek-ai
          for pkg in cordis schemastery dsh-agent dsh-session dsh-llm dsh-tools dsh-subagent dsh-sandbox dsh-sandbox-policy dsh-user-approval dsh-agent-presets dsh-settings dsh-verifier; do
            src="$PWD/.dsh-source/node_modules/@deepseek-ai/$pkg"
            [ -d "$src" ] && ln -sf "$src" "node_modules/@deepseek-ai/$pkg" || true
          done

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "version ok: v$PKG"

      - name: Syntax + tests
        run: node --check lib/index.js && node --test test/*.test.js

      - name: Validate release package
        run: |
          npm pack --dry-run --json > pack-output.json
          node -e "const fs=require('fs'); const parsed=JSON.parse(fs.readFileSync('pack-output.json','utf8')); const pack=Array.isArray(parsed) ? parsed[0] : Object.values(parsed)[0]; const files=pack.files.map(f=>f.path); const banned=files.filter(p=>/^(test|fixtures|\.github)\//.test(p)); if(banned.length) { console.error('Unexpected packed files:', banned); process.exit(1) }"
          test -f cordis.patch.yml
          grep -Eq '^\s*- insert:|^\s*name: dsh-game-studio$' cordis.patch.yml

      - name: Build changelog
        id: changelog
        run: |
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')"
          if [ -z "$PREV" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV}..HEAD"
          fi
          {
            echo "### 变更"
            echo
            git log --pretty=format:'- %s' $RANGE --no-merges | sed 's/^/- /' | head -100
          } > CHANGELOG_SECTION.md
          echo "--- changelog preview ---"
          cat CHANGELOG_SECTION.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "dsh-game-studio $GITHUB_REF_NAME" \
            --notes-file CHANGELOG_SECTION.md \
            --verify-tag
