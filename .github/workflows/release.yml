name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "version ok: v$PKG"

      - name: Syntax + tests
        run: node --check lib/index.js && node --test test/*.test.js

      - name: Build changelog
        id: changelog
        run: |
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')"
          if [ -z "$PREV" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV}..HEAD"
          fi
          {
            echo "### 变更"
            echo
            git log --pretty=format:'- %s' $RANGE --no-merges | sed 's/^/- /' | head -100
          } > CHANGELOG_SECTION.md
          echo "--- changelog preview ---"
          cat CHANGELOG_SECTION.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "dsh-game-studio $GITHUB_REF_NAME" \
            --notes-file CHANGELOG_SECTION.md \
            --verify-tag
