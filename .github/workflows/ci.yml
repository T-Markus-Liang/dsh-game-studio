name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 测试通过依赖注入 mock DSH 包（src/config.js 的 getZ 参数），
      # CI 无需 checkout DSH monorepo。新增 DSH 运行时 import 时须同步 mock。

      - name: Syntax check
        run: node --check lib/index.js
      - name: Run tests
        run: node --test test/*.test.js
      - name: Validate assets manifest (when present)
        run: node --test test/assets.test.js 2>/dev/null || echo "assets tests not yet present — skip"
