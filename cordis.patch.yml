# dsh-game-studio bundle patch: 安装插件时把本行并入目标 profile 的补丁层。
# 卸载 = 从补丁层删掉这一行（Cordis effect 自动解除全部注册）。
- insert:
    - id: game-studio
      name: dsh-game-studio
      config:
        reviewMode: lean
        verify:
          maxRepairRounds: 2
        engines: {}
        # engines.godot.bin（可选）：指定 Godot 可执行文件绝对路径，
        # 例如 engines: { godot: { bin: "/opt/homebrew/bin/godot" } }。
        # 仅在 DSH 进程 PATH 不含 godot、且未设置 GODOT_BIN 时使用；
        # 该 bin 值只写在用户 profile 配置里，这里保持空对象，不写死。
        models:
          orchestrator: null
          lead: null
          specialist: null
          verifier: null
          utility: null
